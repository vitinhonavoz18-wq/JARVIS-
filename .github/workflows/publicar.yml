name: Publicar JARVIS
on:
  workflow_dispatch:
  push:
    branches: [claude/friendly-fermi-28saj3]
permissions:
  contents: read
concurrency:
  group: jarvis-producao
  cancel-in-progress: false

jobs:
  verificar:
    uses: ./.github/workflows/ci.yml
  publicar:
    needs: verificar
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    environment: production
    env:
      PROJECT_REF: srpkpptzbtyleoqwljrl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Conferir configuração de produção
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then echo "::error::Configure $name no GitHub"; missing=1; fi
          done
          [[ "$PUBLIC_KEY" == sb_publishable_* ]] || { echo '::error::Configure VITE_SUPABASE_PUBLISHABLE_KEY'; missing=1; }
          exit "$missing"
      - run: npm ci
      - name: Preparar site em Modo Nuvem
        env:
          VITE_SUPABASE_URL: https://srpkpptzbtyleoqwljrl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build:worker
      - uses: supabase/setup-cli@v1
        with:
          version: 2.79.0
      - name: Publicar banco e funções
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --linked --yes
          supabase functions deploy --project-ref "$PROJECT_REF" --use-api
          functions=$(supabase functions list --project-ref "$PROJECT_REF" --output json)
          for slug in ai-chat jarvis-command automation-gateway process-reminders transcribe jarvis-events; do
            jq -e --arg slug "$slug" 'any(.[]; .slug == $slug and .status == "ACTIVE")' <<< "$functions"
          done
      - name: Publicar no Worker do JARVIS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.0 deploy deploy/worker.mjs --name jarvis-fv --compatibility-date 2026-10-01 --keep-vars
      - name: Conferir versão servida no domínio
        run: |
          for attempt in {1..12}; do
            if curl -fsS --max-time 10 "https://jarvis.conectfly.com.br/?deploy=$GITHUB_RUN_ID" | cmp -s dist/index.html -; then exit 0; fi
            sleep 5
          done
          echo 'O domínio ainda não serviu a versão publicada.'
          exit 1
