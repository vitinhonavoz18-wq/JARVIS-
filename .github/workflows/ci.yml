name: CI
on:
  push:
    branches-ignore: [claude/friendly-fermi-28saj3]
  workflow_call:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Validar as seis Edge Functions
        working-directory: supabase/functions
        run: |
          deno check --frozen */index.ts
          deno test --frozen --allow-env --allow-read --allow-net _shared/*.test.ts
      - name: Testar navegação e persistência no Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run preview -- --port 4173 --strictPort > "$RUNNER_TEMP/jarvis-preview.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://localhost:4173/ -o /dev/null
          npm run test:e2e
      - name: Testes de segurança do banco (RLS)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql
          npm run test:db
      - uses: supabase/setup-cli@v1
        with:
          version: 2.79.0
      - name: Validar login, persistência e RLS no Supabase local
        run: |
          supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime > "$RUNNER_TEMP/supabase-start.log"
          export VITE_SUPABASE_URL=http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY=$(supabase status -o json | jq -er '.PUBLISHABLE_KEY // .ANON_KEY')
          export VITE_SUPABASE_PUBLISHABLE_KEY
          npm run dev -- --host 127.0.0.1 --port 4174 --strictPort > "$RUNNER_TEMP/jarvis-auth.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4174/ -o /dev/null
          node scripts/e2e-supabase.mjs
