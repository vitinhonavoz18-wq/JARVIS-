# Configuração mínima para o Supabase CLI (supabase link / functions deploy / db push).
project_id = "jarvis-fv"

[functions.ai-chat]
verify_jwt = true

[functions.transcribe]
verify_jwt = true

# Chamada pelo Supabase Cron com um segredo próprio (x-cron-secret), não por usuários.
[functions.process-reminders]
verify_jwt = false

# Autenticado pela chave pessoal do usuário (Siri/Android), não por sessão do app.
[functions.jarvis-command]
verify_jwt = false

[functions.automation-gateway]
verify_jwt = true

# Recebe eventos do n8n autenticados por assinatura HMAC por conexão.
[functions.jarvis-events]
verify_jwt = false

[functions.tts]
verify_jwt = true
